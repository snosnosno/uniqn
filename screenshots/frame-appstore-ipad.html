<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 2064px;
    height: 2752px;
  }
  body {
    background: linear-gradient(180deg, #09090B 0%, #141418 40%, #09090B 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    overflow: hidden;
  }
  .caption-area {
    margin-top: 90px;
    text-align: center;
    padding: 0 120px;
  }
  .caption-main {
    font-size: 96px;
    font-weight: 800;
    color: #D4AF37;
    letter-spacing: -2px;
    line-height: 1.15;
  }
  .caption-sub {
    font-size: 44px;
    font-weight: 400;
    color: #a0a0a8;
    margin-top: 22px;
    line-height: 1.3;
  }
  .tablet-frame {
    margin-top: 72px;
    display: flex;
    align-items: flex-start;
    justify-content: center;
  }
  .tablet-bezel {
    width: 1680px;
    height: 2240px;
    background: #1c1c1e;
    border-radius: 56px;
    border: 5px solid #3a3a3c;
    padding: 32px;
    box-shadow:
      0 0 0 3px #2a2a2c,
      0 48px 96px rgba(0,0,0,0.7),
      0 0 150px rgba(212,175,55,0.08);
    position: relative;
    overflow: hidden;
  }
  .tablet-bezel::before {
    content: '';
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    width: 10px;
    height: 10px;
    background: #2a2a2c;
    border-radius: 50%;
    z-index: 10;
  }
  .tablet-screen {
    width: 100%;
    height: 100%;
    border-radius: 30px;
    overflow: hidden;
  }
  .tablet-screen img {
    width: 100%;
    height: 100%;
    object-fit: fill;
    display: block;
  }
</style>
</head>
<body>
  <div class="caption-area">
    <div class="caption-main" id="captionMain"></div>
    <div class="caption-sub" id="captionSub"></div>
  </div>
  <div class="tablet-frame">
    <div class="tablet-bezel">
      <div class="tablet-screen">
        <img id="screenshot" src="" alt="screenshot">
      </div>
    </div>
  </div>
</body>
</html>
