<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1242px;
    height: 2688px;
  }
  body {
    background: linear-gradient(180deg, #09090B 0%, #141418 40%, #09090B 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    overflow: hidden;
  }
  .caption-area {
    margin-top: 70px;
    text-align: center;
    padding: 0 72px;
  }
  .caption-main {
    font-size: 84px;
    font-weight: 800;
    color: #D4AF37;
    letter-spacing: -2px;
    line-height: 1.15;
  }
  .caption-sub {
    font-size: 38px;
    font-weight: 400;
    color: #a0a0a8;
    margin-top: 20px;
    line-height: 1.3;
  }
  .phone-frame {
    margin-top: 56px;
    display: flex;
    align-items: flex-start;
    justify-content: center;
  }
  .phone-bezel {
    width: 1040px;
    height: 2256px;
    background: #1c1c1e;
    border-radius: 100px;
    border: 6px solid #3a3a3c;
    padding: 20px;
    box-shadow:
      0 0 0 3px #2a2a2c,
      0 56px 112px rgba(0,0,0,0.7),
      0 0 150px rgba(212,175,55,0.08);
    position: relative;
    overflow: hidden;
  }
  .phone-bezel::before {
    content: '';
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 272px;
    height: 50px;
    background: #1c1c1e;
    border-radius: 0 0 30px 30px;
    z-index: 10;
  }
  .phone-screen {
    width: 100%;
    height: 100%;
    border-radius: 80px;
    overflow: hidden;
  }
  .phone-screen img {
    width: 100%;
    height: 100%;
    object-fit: fill;
    display: block;
  }
</style>
</head>
<body>
  <div class="caption-area">
    <div class="caption-main" id="captionMain"></div>
    <div class="caption-sub" id="captionSub"></div>
  </div>
  <div class="phone-frame">
    <div class="phone-bezel">
      <div class="phone-screen">
        <img id="screenshot" src="" alt="screenshot">
      </div>
    </div>
  </div>
</body>
</html>
