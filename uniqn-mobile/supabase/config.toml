# UNIQN Mobile - Supabase 로컬 개발 설정
# 사용처: GitHub Actions e2e CI에서 `supabase start`로 로컬 Supabase 컨테이너 기동
# 참고: https://supabase.com/docs/guides/cli/config

# 프로젝트 식별자 (로컬 컨테이너 prefix)
project_id = "uniqn"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# 로컬 메일 캐치
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:4101"
additional_redirect_urls = ["http://localhost:4101", "http://127.0.0.1:4101"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = false

[auth.sms]
enable_signup = false
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[analytics]
enabled = false

# Edge Functions 개별 설정
#
# verify_jwt = false 이유: Supabase 플랫폼 게이트웨이가 ES256 비대칭 JWT를 지원하지
# 않아(2026-04 기준) user JWT 요청이 401로 거부됨(에러: UNAUTHORIZED_UNSUPPORTED_TOKEN_ALGORITHM).
# 함수 내부에서 Authorization 헤더 검사 + auth.getUser()로 Auth 서버 위임 검증 → 보안 동일.
# Supabase 게이트웨이가 ES256 정식 지원하면 제거하고 기본값(true)으로 돌릴 것.

[functions.approve-job-posting]
verify_jwt = false

[functions.reject-job-posting]
verify_jwt = false

[functions.resubmit-job-posting]
verify_jwt = false

[functions.revoke-apple-token]
verify_jwt = false

[functions.verify-portone-identity]
verify_jwt = false

[functions.reset-unread-counter]
verify_jwt = false

[functions.decrement-unread-counter]
verify_jwt = false
