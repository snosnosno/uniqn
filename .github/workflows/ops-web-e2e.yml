name: ops-web E2E

# ops-web(대회 운영 웹) 브라우저 E2E — 로컬 Supabase 를 띄워 실제 RPC·RLS·realtime 위에서 돈다.
# 🔴 pull_request 에 `paths:` 를 두지 않는다(e2e.yml 머리말과 같은 이유 — required check 데드락).
#    무거운 잡은 `changes` 판정이 true 일 때만 돈다.
# 범위: w4(콘솔)·w5(좌석)·w56(블라인드·상금·스태프·이력)·w7(공개뷰)·w9(콘솔 도구)·w10(운영 편의)·w11(자동 전환·자동 마감·일괄 등록·기기 이름).
#   w2(인증 메일 왕복)는 다른 E2E 의 세션을 폐기하고, w4-idle 은 66분 방치라 로컬 전용으로 둔다.
on:
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ops-web-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read # GHCR 인증 pull

jobs:
  changes:
    name: Detect ops changes
    runs-on: ubuntu-latest
    outputs:
      ops: ${{ steps.filter.outputs.ops }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect ops-web relevant changes
        id: filter
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "ops=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          # 판정 불가면 보수적으로 실행한다.
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "ops=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # ops-web 자체 · 동기화 정본(ops 도메인) · DB 마이그레이션 · 이 워크플로
          if git diff --name-only "$base" "$head" \
               | grep -qE '^(ops-web/|uniqn-mobile/supabase/migrations/|uniqn-mobile/src/(domains/ops|services/ops|repositories/supabase/Ops|schemas/ops|types/ops)|scripts/sync-ops-core\.mjs$|\.github/workflows/ops-web-e2e\.yml$)'; then
            echo "ops=true" >> "$GITHUB_OUTPUT"
          else
            echo "ops 관련 변경 없음 — 건너뜀"
            echo "ops=false" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    name: ops-web E2E
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.ops == 'true'
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.107.0
          github-token: ${{ github.token }}

      # ghcr 익명 pull 레이트리밋 대응 — db-tests.yml 의 같은 스텝 주석 참조
      - name: Log in to GHCR
        continue-on-error: true
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Start local Supabase
        working-directory: uniqn-mobile
        run: |
          for i in 1 2 3 4; do
            if supabase start -x studio,imgproxy,vector,logflare,edge-runtime,supavisor; then exit 0; fi
            [ "$i" -eq 4 ] && break
            wait=$((i * 30))
            echo "::warning::supabase start 실패 (${i}/4) — ${wait}s 후 재시도"
            supabase stop --no-backup || true
            sleep "$wait"
          done
          echo "::error::supabase start 4회 모두 실패"
          exit 1

      - name: Write ops-web local env
        working-directory: uniqn-mobile
        shell: bash
        run: |
          set -euo pipefail
          STATUS_OUT=$(supabase status -o env)
          URL=$(echo "$STATUS_OUT" | grep -E '^API_URL=' | sed -E 's/^API_URL="?([^"]+)"?/\1/')
          ANON=$(echo "$STATUS_OUT" | grep -E '^ANON_KEY=' | sed -E 's/^ANON_KEY="?([^"]+)"?/\1/')
          if [ -z "$URL" ] || [ -z "$ANON" ]; then
            echo "$STATUS_OUT" >&2
            exit 1
          fi
          printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_ANON_KEY=%s\n' "$URL" "$ANON" > ../ops-web/.env.development.local

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            ops-web/package-lock.json
            uniqn-mobile/package-lock.json

      # E2E 는 Playwright 를 uniqn-mobile 설치본에서 빌려 쓴다(ops-web/e2e/lib.mjs).
      - name: Install dependencies
        run: |
          npm ci --prefix ops-web
          npm ci --prefix uniqn-mobile --ignore-scripts

      - name: Install Playwright browser
        working-directory: uniqn-mobile
        run: npx playwright install --with-deps chromium

      - name: Build ops-web (local Supabase)
        working-directory: ops-web
        run: npm run build

      - name: Run E2E
        working-directory: ops-web
        run: |
          set -euo pipefail
          npx vite preview --port 4173 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/ >/dev/null && break; sleep 1; done
          status=0
          for t in w4-console w5-tables w56-console w7-public w9-console-tools w10-ux w11-auto; do
            echo "::group::$t"
            node "e2e/$t.mjs" || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ops-web-e2e-output
          path: ops-web/e2e-output/
          retention-days: 7

      - name: Stop local Supabase
        if: always()
        working-directory: uniqn-mobile
        run: supabase stop --no-backup || true
