# prod↔repo 파리티 스모크 — 재발산 조기경보
#
# 2026-07-11 baseline squash(파리티 정합화 ④)의 CI 가드. 주기적으로 prod 라이브 카운트를
# 실측해 repo 기대값(supabase/tests/parity_baseline_guard.test.sql 의 PARITY_EXPECT_* 마커)과
# 대조한다. 로컬 측은 db-tests job 의 동일 pgTAP 가드가 담당하므로, 이 워크플로우가 실패하면
# "prod 에 repo 밖 핫픽스가 적용됨(D1 드리프트)" 신호다 — 해당 변경을 마이그레이션으로 역이식하고
# 기대값을 같은 PR 에서 갱신할 것.
#
# 필요 시크릿: PROD_DB_URL — Session pooler URI (Settings→Database→Connect).
#   미설정 시 스모크는 notice 만 남기고 skip(성공 처리)한다.
# PR 게이트 아님: schedule/dispatch 전용(기존 CI 9종 불변).

name: parity-smoke

on:
  schedule:
    - cron: '17 1 * * 1' # 매주 월 01:17 UTC (10:17 KST)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parity-smoke
  cancel-in-progress: true

jobs:
  parity-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: uniqn-mobile
    env:
      PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: prod 카운트 실측 vs repo 기대값 대조
        run: |
          if [ -z "$PROD_DB_URL" ]; then
            echo "::notice::PROD_DB_URL 시크릿 미설정 — 파리티 스모크 skip"
            exit 0
          fi

          GUARD=supabase/tests/parity_baseline_guard.test.sql
          EXPECT_FUNCS=$(grep -oP '^-- PARITY_EXPECT_FUNCS=\K[0-9]+' "$GUARD")
          EXPECT_POLICIES=$(grep -oP '^-- PARITY_EXPECT_POLICIES=\K[0-9]+' "$GUARD")
          echo "repo 기대값: funcs=$EXPECT_FUNCS policies=$EXPECT_POLICIES pg_temp_missing=0"

          # 쿼리는 pgTAP 가드(parity_baseline_guard.test.sql)와 동일식 — 확장 소속·테스트 헬퍼 제외
          ACTUAL=$(psql "$PROD_DB_URL" -tA -v ON_ERROR_STOP=1 <<'SQL'
          SELECT
            (SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
             WHERE n.nspname = 'public'
               AND NOT EXISTS (SELECT 1 FROM pg_depend d
                               WHERE d.classid = 'pg_proc'::regclass AND d.objid = p.oid AND d.deptype = 'e')
               AND p.proname NOT LIKE 'jpc\_%' AND p.proname NOT LIKE 'ops\_test\_%')
            || ' ' ||
            (SELECT count(*) FROM pg_policies WHERE schemaname = 'public')
            || ' ' ||
            (SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
             WHERE n.nspname = 'public' AND p.prosecdef
               AND p.proname NOT LIKE 'jpc\_%' AND p.proname NOT LIKE 'ops\_test\_%'
               AND EXISTS (SELECT 1 FROM unnest(coalesce(p.proconfig, ARRAY[]::text[])) c
                           WHERE c LIKE 'search_path=%' AND c NOT ILIKE '%pg_temp%'));
          SQL
          )
          read -r ACT_FUNCS ACT_POLICIES ACT_PGTEMP <<< "$ACTUAL"
          echo "prod 실측: funcs=$ACT_FUNCS policies=$ACT_POLICIES pg_temp_missing=$ACT_PGTEMP"

          FAIL=0
          [ "$ACT_FUNCS" = "$EXPECT_FUNCS" ] || { echo "::error::함수 카운트 발산: prod=$ACT_FUNCS repo=$EXPECT_FUNCS"; FAIL=1; }
          [ "$ACT_POLICIES" = "$EXPECT_POLICIES" ] || { echo "::error::정책 카운트 발산: prod=$ACT_POLICIES repo=$EXPECT_POLICIES"; FAIL=1; }
          [ "$ACT_PGTEMP" = "0" ] || { echo "::error::SECDEF pg_temp 누락 재발: prod=$ACT_PGTEMP (기대 0)"; FAIL=1; }
          exit $FAIL
