name: ops-web

# ops.uniqn.app (Vite SPA) — 설계 docs/planning/2026-09-27-ops-web-design.md §8·§9.
# ⚠️ 이 워크플로는 branch protection 의 required check 가 **아니다** → pull_request 에도
#    paths 필터를 둔다(ci.yml 의 "required check + paths = 영원히 pending" 함정과 무관).
#    required 로 승격할 때는 ci.yml 처럼 changes 잡 + 애그리게이터 구조로 바꿔야 한다.
#
# 🔑 paths 에 동기화 정본(uniqn-mobile/src 의 ops 도메인·의존)을 넣어 둔다 — 모바일만 고친 PR 도
#    `sync-ops-core --check` 를 타야 드리프트가 머지 전에 잡힌다. 정본 목록은 scripts/sync-ops-core.mjs 와 맞춘다.
on:
  pull_request:
    branches: [master]
    paths:
      - 'ops-web/**'
      - '.github/workflows/ops-web.yml'
      - 'scripts/sync-ops-core.mjs'
      - 'scripts/__tests__/sync-ops-core.test.mjs'
      - 'uniqn-mobile/package.json'
      - 'uniqn-mobile/src/domains/ops/**'
      - 'uniqn-mobile/src/types/ops.ts'
      - 'uniqn-mobile/src/types/role.ts'
      - 'uniqn-mobile/src/types/supabase.ts'
      - 'uniqn-mobile/src/types/user.ts'
      - 'uniqn-mobile/src/utils/security.ts'
      - 'uniqn-mobile/src/utils/text/josa.ts'
      - 'uniqn-mobile/src/constants/messages/**'
      - 'uniqn-mobile/src/errors/AppError.ts'
      - 'uniqn-mobile/src/errors/errorUtils.ts'
      - 'uniqn-mobile/src/utils/supabase.ts'
      - 'uniqn-mobile/src/schemas/ops*.schema.ts'
      - 'uniqn-mobile/src/schemas/common.ts'
      - 'uniqn-mobile/src/schemas/auth.schema.ts'
      - 'uniqn-mobile/src/schemas/__tests__/ops*.test.ts'
      - 'uniqn-mobile/src/hooks/ops/publicPollingPolicy.ts'
      - 'uniqn-mobile/src/hooks/ops/__tests__/publicPollingPolicy.test.ts'
      - 'uniqn-mobile/src/shared/navigation/authRedirect.ts'
      - 'uniqn-mobile/src/shared/navigation/__tests__/authRedirect.test.ts'
      - 'uniqn-mobile/src/repositories/supabase/opsRpcError.ts'
      - 'uniqn-mobile/src/repositories/supabase/Ops*Repository.ts'
      - 'uniqn-mobile/src/repositories/interfaces/IOps*Repository.ts'
      - 'uniqn-mobile/src/repositories/ops.ts'
      - 'uniqn-mobile/src/services/ops/**'
      - 'uniqn-mobile/src/errors/serviceErrorHandler.ts'
      - 'uniqn-mobile/src/utils/formatters/currency.ts'
      - 'uniqn-mobile/src/components/ops/payout*.ts'
      - 'uniqn-mobile/src/components/ops/__tests__/payout*.test.ts'
  push:
    branches: [master]
    # pull_request 와 같은 목록(앵커 대신 복제 — 바꿀 때 두 곳 모두)
    paths:
      - 'ops-web/**'
      - '.github/workflows/ops-web.yml'
      - 'scripts/sync-ops-core.mjs'
      - 'scripts/__tests__/sync-ops-core.test.mjs'
      - 'uniqn-mobile/package.json'
      - 'uniqn-mobile/src/domains/ops/**'
      - 'uniqn-mobile/src/types/ops.ts'
      - 'uniqn-mobile/src/types/role.ts'
      - 'uniqn-mobile/src/types/supabase.ts'
      - 'uniqn-mobile/src/types/user.ts'
      - 'uniqn-mobile/src/utils/security.ts'
      - 'uniqn-mobile/src/utils/text/josa.ts'
      - 'uniqn-mobile/src/constants/messages/**'
      - 'uniqn-mobile/src/errors/AppError.ts'
      - 'uniqn-mobile/src/errors/errorUtils.ts'
      - 'uniqn-mobile/src/utils/supabase.ts'
      - 'uniqn-mobile/src/schemas/ops*.schema.ts'
      - 'uniqn-mobile/src/schemas/common.ts'
      - 'uniqn-mobile/src/schemas/auth.schema.ts'
      - 'uniqn-mobile/src/schemas/__tests__/ops*.test.ts'
      - 'uniqn-mobile/src/hooks/ops/publicPollingPolicy.ts'
      - 'uniqn-mobile/src/hooks/ops/__tests__/publicPollingPolicy.test.ts'
      - 'uniqn-mobile/src/shared/navigation/authRedirect.ts'
      - 'uniqn-mobile/src/shared/navigation/__tests__/authRedirect.test.ts'
      - 'uniqn-mobile/src/repositories/supabase/opsRpcError.ts'
      - 'uniqn-mobile/src/repositories/supabase/Ops*Repository.ts'
      - 'uniqn-mobile/src/repositories/interfaces/IOps*Repository.ts'
      - 'uniqn-mobile/src/repositories/ops.ts'
      - 'uniqn-mobile/src/services/ops/**'
      - 'uniqn-mobile/src/errors/serviceErrorHandler.ts'
      - 'uniqn-mobile/src/utils/formatters/currency.ts'
      - 'uniqn-mobile/src/components/ops/payout*.ts'
      - 'uniqn-mobile/src/components/ops/__tests__/payout*.test.ts'

defaults:
  run:
    working-directory: ops-web

permissions:
  contents: read

jobs:
  quality:
    name: ops-web quality
    runs-on: ubuntu-latest
    concurrency:
      group: ops-web-quality-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ops-web/package-lock.json

      - run: npm ci

      # 동기화 스크립트 자체 테스트 — 레포 루트엔 node_modules 가 없어 Node 내장 test runner 를 쓴다.
      - name: sync-ops-core unit tests
        run: node --test ../scripts/__tests__/sync-ops-core.test.mjs

      # quality 가 sync:check(정본 ↔ ops-web/src/core 일치)를 포함한다.
      - run: npm run quality

      # CI 에는 로컬 Supabase 가 없다 — 가짜 로컬 URL 로 번들이 만들어지는지만 본다.
      - name: Build (development mode)
        run: npm run build
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: ci-placeholder

  deploy:
    name: ops-web deploy (Cloudflare)
    needs: quality
    # 저장소 변수 OPS_WEB_DEPLOY_ENABLED=true 를 켜기 전에는 배포하지 않는다 —
    # 시크릿 준비 전 머지로 master 가 빨개지거나, 의도치 않게 도메인이 열리는 것을 막는다.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/master' &&
      vars.OPS_WEB_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # 진행 중인 배포는 취소하지 않는다 — 반쯤 올라간 상태로 끊기지 않게 순서대로 줄 세운다.
    concurrency:
      group: ops-web-deploy
      cancel-in-progress: false
    # GitHub → Settings → Environments → `ops-web-production` 에 시크릿 4종을 둔다(설계 §8).
    environment: ops-web-production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ops-web/package-lock.json

      - run: npm ci

      # 빌드 가드(config/envGuard.ts)가 production 인데 localhost 면 여기서 실패한다.
      - name: Build (production)
        run: npm run build:prod
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
