name: DB Tests (pg_prove)

on:
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'uniqn-mobile/supabase/**'
      - '.github/workflows/db-tests.yml'
  push:
    branches: [main, master, develop]
    paths:
      - 'uniqn-mobile/supabase/**'
      - '.github/workflows/db-tests.yml'

defaults:
  run:
    working-directory: uniqn-mobile

jobs:
  db-tests:
    name: DB Tests (pg_prove)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read # GHCR 인증 pull (아래 Log in to GHCR)

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          # 버전 pin: version:latest 는 GitHub API 'resolve latest' 호출로 익명 rate-limit(#172
          # 6초 실패) + 이미지 드리프트(implicit 테이블 GRANT 소실 회귀, PR #179) 유발.
          # 고정 버전 + github-token 인증으로 둘 다 예방. 갱신 시 supabase/cli 릴리스 참고.
          version: 2.107.0
          github-token: ${{ github.token }}

      # 🔴 ghcr 익명 pull 은 레이트리밋이 낮다 — postgres 이미지(레이어 29개)에서 `toomanyrequests`
      #    로 `supabase start` 가 죽어 pgTAP 이 한 줄도 안 돈 채 red 가 된다(2026-09-23 PR#512,
      #    1시간 45분 간격 3회 연속, 다른 이미지는 정상). GITHUB_TOKEN 인증 pull 로 한도를 올린다.
      #    로그인 실패는 치명이 아니다 — 익명으로 계속 시도한다.
      - name: Log in to GHCR
        continue-on-error: true
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # CLI 내장 재시도(4s→8s, 약 12초)는 분 단위로 풀리는 레이트리밋을 넘기지 못한다.
      # 30/60/90초 간격으로 최대 4회 시도한다(최악 +3분, timeout 20분 안).
      - name: Start local Supabase
        run: |
          for i in 1 2 3 4; do
            if supabase start; then exit 0; fi
            [ "$i" -eq 4 ] && break
            wait=$((i * 30))
            echo "::warning::supabase start 실패 (${i}/4) — ${wait}s 후 재시도"
            supabase stop --no-backup || true
            sleep "$wait"
          done
          echo "::error::supabase start 4회 모두 실패"
          exit 1

      - name: Register pgTAP helpers
        # cross-platform 패턴 (Windows PowerShell 의 stdin redirect `<` 비호환 회피).
        # `npm run test:db:helpers` 와 동일 — 단일 진실 소스로 npm script 직접 호출.
        run: npm run test:db:helpers

      - name: Run pg_prove tests
        run: supabase test db

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true
