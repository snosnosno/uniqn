name: E2E Tests

# 🔴 pull_request 에 `paths:` 를 두지 않는다 — 이유는 ci.yml 머리말과 같다.
#    (paths 필터 + required check = 영구 pending 데드락, 2026-07 #375 실사고)
#    무거운 E2E 는 아래 `changes` 판정이 true 일 때만 돌고,
#    required check 로 쓸 애그리게이터는 `E2E Gate` 다(`if: always()`).
on:
  pull_request:
    branches: [main, master, develop]
  schedule:
    # 매주 월요일 09:00 KST (일요일 24:00 UTC)
    - cron: '0 0 * * 1'
  workflow_dispatch:

defaults:
  run:
    working-directory: uniqn-mobile

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect app-relevant changes
        id: filter
        run: |
          set -euo pipefail
          # schedule/workflow_dispatch 는 항상 전체 실행한다.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          # 판정 불가면 **보수적으로 실행**한다 — E2E 를 조용히 건너뛰는 쪽이 더 위험하다.
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "base sha 를 못 찾음 — 보수적으로 전체 실행"
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$base" "$head" \
               | grep -qE '^(uniqn-mobile/|\.github/workflows/e2e\.yml$)'; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "앱 코드 변경 없음 — E2E 건너뜀"
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.app == 'true'
    timeout-minutes: 75
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          # 버전 pin + github-token: version:latest 의 익명 GitHub API rate-limit(#172) +
          # 이미지 드리프트(PR #179) 예방. 갱신 시 supabase/cli 릴리스 참고.
          version: 2.107.0
          github-token: ${{ github.token }}

      - name: Start local Supabase
        run: supabase start

      - name: Export Supabase env vars
        shell: bash
        run: |
          set -euo pipefail
          STATUS_OUT=$(supabase status -o env)
          # supabase status -o env 출력 예시:
          #   API_URL="http://127.0.0.1:54321"
          #   ANON_KEY="eyJhbGciOi..."
          #   SERVICE_ROLE_KEY="eyJhbGciOi..."
          SUPA_URL=$(echo "$STATUS_OUT" | grep -E '^API_URL=' | sed -E 's/^API_URL="?([^"]+)"?/\1/')
          SUPA_ANON=$(echo "$STATUS_OUT" | grep -E '^ANON_KEY=' | sed -E 's/^ANON_KEY="?([^"]+)"?/\1/')
          SUPA_SR=$(echo "$STATUS_OUT" | grep -E '^SERVICE_ROLE_KEY=' | sed -E 's/^SERVICE_ROLE_KEY="?([^"]+)"?/\1/')

          if [ -z "$SUPA_URL" ] || [ -z "$SUPA_ANON" ] || [ -z "$SUPA_SR" ]; then
            echo "Failed to parse supabase status output:" >&2
            echo "$STATUS_OUT" >&2
            exit 1
          fi

          echo "EXPO_PUBLIC_SUPABASE_URL=${SUPA_URL}" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${SUPA_ANON}" >> "$GITHUB_ENV"
          echo "E2E_SUPABASE_SERVICE_ROLE_KEY=${SUPA_SR}" >> "$GITHUB_ENV"
          echo "Local Supabase ready: ${SUPA_URL}"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: uniqn-mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Create .env.test for E2E
        shell: bash
        run: |
          cat <<EOF > e2e/.env.test
          EXPO_PUBLIC_RELEASE_CHANNEL=development
          EXPO_PUBLIC_SUPABASE_URL=${EXPO_PUBLIC_SUPABASE_URL}
          EXPO_PUBLIC_SUPABASE_ANON_KEY=${EXPO_PUBLIC_SUPABASE_ANON_KEY}
          EOF

      - name: Build Web
        run: npm run build:web
        env:
          EXPO_PUBLIC_RELEASE_CHANNEL: 'development'
          EXPO_PUBLIC_SUPABASE_URL: ${{ env.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ env.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Run E2E Tests
        run: npm run e2e
        env:
          CI: 'true'
          EXPO_PUBLIC_SUPABASE_URL: ${{ env.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ env.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ env.E2E_SUPABASE_SERVICE_ROLE_KEY }}

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true

      - name: Upload Playwright Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report
          path: uniqn-mobile/output/playwright/report/
          retention-days: 14

      - name: Upload Test Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: e2e-test-results
          path: |
            uniqn-mobile/output/playwright/test-results/
          retention-days: 7

      - name: Comment E2E Results on PR
        if: github.event_name == 'pull_request' && always()
        continue-on-error: true  # PR comment 403 방어 (fork PR 등)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const status = '${{ job.status }}';
            const emoji = status === 'success' ? '✅' : '❌';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = [
              `## ${emoji} E2E Test Results`,
              '',
              `**Status:** ${status}`,
              `**Run:** [View Details](${runUrl})`,
              '',
              status === 'success'
                ? '모든 E2E 테스트가 통과했습니다.'
                : '일부 E2E 테스트가 실패했습니다. [Artifacts](${runUrl})에서 스크린샷과 트레이스를 확인하세요.',
              '',
              '---',
              '*Generated by E2E workflow*',
            ].join('\n');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  # 🔴 branch protection 의 required check 는 **이 잡**을 쓴다.
  #    `if: always()` 라 E2E 가 건너뛰어져도 반드시 결론을 보고한다 — 영구 pending 이 안 생긴다.
  #    'skipped' 를 성공으로 취급하는 것이 핵심(문서 전용 PR).
  e2e-gate:
    name: E2E Gate
    runs-on: ubuntu-latest
    needs: [changes, e2e]
    if: always()
    defaults:
      run:
        working-directory: .
    steps:
      - name: Check E2E result
        run: |
          result='${{ needs.e2e.result }}'
          if [ "$result" = "skipped" ]; then
            echo "앱 코드 변경이 없어 E2E 를 건너뛰었다 — 통과로 처리"
            exit 0
          fi
          if [ "$result" != "success" ]; then
            echo "E2E failed (result=$result)"
            exit 1
          fi
