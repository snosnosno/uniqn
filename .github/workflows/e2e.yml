name: E2E Tests

on:
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'uniqn-mobile/**'
      - '.github/workflows/e2e.yml'
  schedule:
    # 매주 월요일 09:00 KST (일요일 24:00 UTC)
    - cron: '0 0 * * 1'
  workflow_dispatch:

defaults:
  run:
    working-directory: uniqn-mobile

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true  # T-D2 Docker Supabase 첫 CI 실행 검증 중 — base schema 안정화 후 제거
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Export Supabase env vars
        shell: bash
        run: |
          set -euo pipefail
          STATUS_OUT=$(supabase status -o env)
          # supabase status -o env 출력 예시:
          #   API_URL="http://127.0.0.1:54321"
          #   ANON_KEY="eyJhbGciOi..."
          #   SERVICE_ROLE_KEY="eyJhbGciOi..."
          SUPA_URL=$(echo "$STATUS_OUT" | grep -E '^API_URL=' | sed -E 's/^API_URL="?([^"]+)"?/\1/')
          SUPA_ANON=$(echo "$STATUS_OUT" | grep -E '^ANON_KEY=' | sed -E 's/^ANON_KEY="?([^"]+)"?/\1/')
          SUPA_SR=$(echo "$STATUS_OUT" | grep -E '^SERVICE_ROLE_KEY=' | sed -E 's/^SERVICE_ROLE_KEY="?([^"]+)"?/\1/')

          if [ -z "$SUPA_URL" ] || [ -z "$SUPA_ANON" ] || [ -z "$SUPA_SR" ]; then
            echo "Failed to parse supabase status output:" >&2
            echo "$STATUS_OUT" >&2
            exit 1
          fi

          echo "EXPO_PUBLIC_SUPABASE_URL=${SUPA_URL}" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${SUPA_ANON}" >> "$GITHUB_ENV"
          echo "E2E_SUPABASE_SERVICE_ROLE_KEY=${SUPA_SR}" >> "$GITHUB_ENV"
          echo "Local Supabase ready: ${SUPA_URL}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: uniqn-mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Create .env.test for E2E
        shell: bash
        run: |
          cat <<EOF > e2e/.env.test
          EXPO_PUBLIC_RELEASE_CHANNEL=development
          EXPO_PUBLIC_SUPABASE_URL=${EXPO_PUBLIC_SUPABASE_URL}
          EXPO_PUBLIC_SUPABASE_ANON_KEY=${EXPO_PUBLIC_SUPABASE_ANON_KEY}
          EOF

      - name: Build Web
        run: npm run build:web
        env:
          EXPO_PUBLIC_RELEASE_CHANNEL: 'development'
          EXPO_PUBLIC_SUPABASE_URL: ${{ env.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ env.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Run E2E Tests
        run: npm run e2e
        env:
          CI: 'true'
          EXPO_PUBLIC_SUPABASE_URL: ${{ env.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ env.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ env.E2E_SUPABASE_SERVICE_ROLE_KEY }}

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: uniqn-mobile/output/playwright/report/
          retention-days: 14

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-test-results
          path: |
            uniqn-mobile/output/playwright/test-results/
          retention-days: 7

      - name: Comment E2E Results on PR
        if: github.event_name == 'pull_request' && always()
        continue-on-error: true  # PR comment 403 방어 (fork PR 등)
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const status = '${{ job.status }}';
            const emoji = status === 'success' ? '✅' : '❌';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = [
              `## ${emoji} E2E Test Results`,
              '',
              `**Status:** ${status}`,
              `**Run:** [View Details](${runUrl})`,
              '',
              status === 'success'
                ? '모든 E2E 테스트가 통과했습니다.'
                : '일부 E2E 테스트가 실패했습니다. [Artifacts](${runUrl})에서 스크린샷과 트레이스를 확인하세요.',
              '',
              '---',
              '*Generated by E2E workflow*',
            ].join('\n');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
