name: Deploy Edge Functions

# 트리거:
#   - master 브랜치에 supabase/functions/** 또는 config.toml 변경 push 시 자동 배포
#   - 수동 트리거 (workflow_dispatch) 시 특정 함수 또는 전체 재배포 가능
#
# Drift 방지:
#   - 변경된 함수만 배포 (디폴트) → 다른 함수의 의도치 않은 verify_jwt 변경 방지
#   - config.toml 변경 시에는 전체 재배포 (메타데이터 일괄 동기화)
#
# 필요 secret:
#   - SUPABASE_ACCESS_TOKEN: Personal Access Token (https://supabase.com/dashboard/account/tokens)

on:
  push:
    branches: [master]
    paths:
      - 'uniqn-mobile/supabase/functions/**'
      - 'uniqn-mobile/supabase/config.toml'
      - '.github/workflows/deploy-edge-functions.yml'
  workflow_dispatch:
    inputs:
      function_name:
        description: '배포할 함수명 (비워두면 변경된 함수만, "all" 입력 시 전체)'
        required: false
        type: string
        default: ''

concurrency:
  group: deploy-edge-functions-${{ github.ref }}
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: ygfxukhktpqymahfrvbz

jobs:
  deploy:
    name: Deploy Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Determine functions to deploy
        id: targets
        working-directory: uniqn-mobile
        run: |
          set -euo pipefail
          INPUT="${{ github.event.inputs.function_name }}"

          if [ "$INPUT" = "all" ]; then
            echo "Mode: deploy ALL functions (manual)"
            ls supabase/functions | grep -v '^_' > /tmp/targets.txt
          elif [ -n "$INPUT" ]; then
            echo "Mode: deploy single function ($INPUT)"
            echo "$INPUT" > /tmp/targets.txt
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              BEFORE="HEAD~1"
            fi

            # config.toml 변경 → 메타데이터 전체 동기화
            if git diff --name-only "$BEFORE" "${{ github.sha }}" | grep -q '^uniqn-mobile/supabase/config.toml$'; then
              echo "Mode: config.toml changed → deploy ALL functions"
              ls supabase/functions | grep -v '^_' > /tmp/targets.txt
            else
              echo "Mode: detect changed functions"
              git diff --name-only "$BEFORE" "${{ github.sha }}" -- supabase/functions/ \
                | awk -F/ '/supabase\/functions\// {print $3}' \
                | sort -u | grep -v '^$' > /tmp/targets.txt || true
            fi
          fi

          if [ ! -s /tmp/targets.txt ]; then
            echo "No functions to deploy"
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Targets:"
          cat /tmp/targets.txt
          echo "count=$(wc -l < /tmp/targets.txt)" >> "$GITHUB_OUTPUT"

      - name: Deploy functions
        if: steps.targets.outputs.count != '0'
        working-directory: uniqn-mobile
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          FAILED=()
          while IFS= read -r fn; do
            [ -z "$fn" ] && continue
            if [ ! -d "supabase/functions/$fn" ]; then
              echo "::warning::Skipping $fn (folder not found locally)"
              continue
            fi
            echo "::group::Deploying $fn"
            if supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF"; then
              echo "✅ $fn deployed"
            else
              echo "::error::❌ $fn deploy failed"
              FAILED+=("$fn")
            fi
            echo "::endgroup::"
          done < /tmp/targets.txt

          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "Failed deployments: ${FAILED[*]}"
            exit 1
          fi

      - name: Summary
        if: always() && steps.targets.outputs.count != '0'
        run: |
          {
            echo "## 🚀 Edge Function Deploy Summary"
            echo ""
            echo "**Project**: \`$SUPABASE_PROJECT_REF\`"
            echo "**Trigger**: ${{ github.event_name }}"
            echo "**Commit**: \`${{ github.sha }}\`"
            echo ""
            echo "### Deployed functions (${{ steps.targets.outputs.count }})"
            if [ -f /tmp/targets.txt ]; then
              sed 's/^/- `/; s/$/`/' /tmp/targets.txt
            fi
          } >> "$GITHUB_STEP_SUMMARY"
