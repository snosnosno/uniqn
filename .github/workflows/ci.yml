name: CI

on:
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'uniqn-mobile/**'
      - 'functions/**'
      - 'firebase.json'
      - '.github/workflows/ci.yml'
  push:
    branches: [main, master, develop]
    paths:
      - 'uniqn-mobile/**'
      - 'functions/**'
      - 'firebase.json'
      - '.github/workflows/ci.yml'

defaults:
  run:
    working-directory: uniqn-mobile

jobs:
  quality:
    name: Quality - ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [type-check, lint, format:check]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: uniqn-mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ${{ matrix.check }}
        run: npm run ${{ matrix.check }}

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: quality
    if: always()
    defaults:
      run:
        working-directory: .
    steps:
      - name: Check quality results
        run: |
          if [ "${{ needs.quality.result }}" != "success" ]; then
            echo "Quality checks failed"
            exit 1
          fi

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: quality-gate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: uniqn-mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Tests with Coverage
        run: npm run test:coverage

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./uniqn-mobile/coverage/lcov.info
          flags: uniqn-mobile
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  bundle-check:
    name: Bundle Size Check
    runs-on: ubuntu-latest
    needs: quality-gate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: uniqn-mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Web Bundle
        run: npm run build:web
        env:
          EXPO_PUBLIC_RELEASE_CHANNEL: 'production'
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: tholdem-ebc18.firebaseapp.com
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: tholdem-ebc18
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: tholdem-ebc18.firebasestorage.app
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '296074758861'
          EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
          EXPO_PUBLIC_FIREBASE_REGION: asia-northeast3

      - name: Check Bundle Size
        id: bundle-check
        run: node scripts/check-bundle-size.js

      - name: Comment Bundle Size on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const bundleReport = fs.readFileSync('bundle-size-report.txt', 'utf8');

            const body = `## 📦 Bundle Size Report\n\n${bundleReport}\n\n**Target**: < 2MB (gzip)`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  eas-check:
    name: EAS Build Check
    runs-on: ubuntu-latest
    needs: [test, bundle-check, functions-build]
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: uniqn-mobile/package-lock.json

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: EAS Build Dry Run (iOS)
        run: eas build --platform ios --profile production --non-interactive --dry-run
        env:
          EXPO_PUBLIC_RELEASE_CHANNEL: 'production'
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: tholdem-ebc18.firebaseapp.com
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: tholdem-ebc18
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: tholdem-ebc18.firebasestorage.app
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '296074758861'
          EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
          EXPO_PUBLIC_FIREBASE_REGION: asia-northeast3

      - name: EAS Build Dry Run (Android)
        run: eas build --platform android --profile production --non-interactive --dry-run
        env:
          EXPO_PUBLIC_RELEASE_CHANNEL: 'production'
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: tholdem-ebc18.firebaseapp.com
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: tholdem-ebc18
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: tholdem-ebc18.firebasestorage.app
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '296074758861'
          EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
          EXPO_PUBLIC_FIREBASE_REGION: asia-northeast3

  functions-build:
    name: Functions Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Functions
        run: npm run build
